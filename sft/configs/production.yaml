model_name_or_path: Qwen/Qwen3-VL-2B-Instruct
train_file: data/processed/sft/train.jsonl
eval_file: data/processed/sft/validation.jsonl
output_dir: outputs/sft
num_train_epochs: 1
max_steps: -1
learning_rate: 2.0e-5
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
bf16: true
tf32: true
logging_steps: 5
save_steps: 500
eval_steps: 500
save_total_limit: null
seed: 3407
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: all-linear
lora_exclude_modules: ".*(visual|vision_tower|vision_model).*"
freeze_vision_tower: true
deepspeed: sft/configs/zero3.json
report_to: none
