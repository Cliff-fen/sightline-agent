model_name_or_path: outputs/sft
train_file: data/processed/rl/train.jsonl
eval_file: data/processed/rl/validation.jsonl
output_dir: outputs/grpo
max_steps: -1
num_train_epochs: 1
learning_rate: 1.0e-6
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
num_generations: 8
steps_per_generation: 2
max_completion_length: 2048
max_tool_calling_iterations: 6
temperature: 0.7
top_p: 1.0
beta: 0.0
loss_type: dapo
scale_rewards: group
mask_truncated_completions: true
gradient_checkpointing: true
bf16: true
tf32: true
logging_steps: 1
save_steps: 500
eval_steps: 500
save_total_limit: null
seed: 3407
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: all-linear
lora_exclude_modules: ".*(visual|vision_tower|vision_model).*"
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.35
vllm_max_model_length: 10240
deepspeed: sft/configs/zero3.json
report_to: none
